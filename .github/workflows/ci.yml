name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Release check (tests, privacy, licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release check (export audit, forbidden strings, licenses, Playwright)
        run: npm run check:release

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  fresh-clone:
    name: npm start works on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start the app and check it answers
        shell: bash
        run: |
          KSL_DATA_DIR="$RUNNER_TEMP/ksl-data" npm start > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          cat server.log
          exit 1
